<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smart Inventory Management{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='vendor/plotly.min.js') }}"></script>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">SIM</span>
      <div class="brand-text">
        <span class="brand-name">Stockroom</span>
        <span class="brand-sub">Inventory Ops</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="{{ url_for('dashboard_page') }}" class="nav-item {% if active=='dashboard' %}active{% endif %}">
        <span class="nav-icon">&#9635;</span> <span class="nav-label">Dashboard</span>
      </a>
      <a href="{{ url_for('inventory_page') }}" class="nav-item {% if active=='inventory' %}active{% endif %}">
        <span class="nav-icon">&#9776;</span> <span class="nav-label">Inventory</span>
      </a>
      <a href="{{ url_for('analytics_page') }}" class="nav-item {% if active=='analytics' %}active{% endif %}">
        <span class="nav-icon">&#9714;</span> <span class="nav-label">Analytics</span>
      </a>
      <a href="{{ url_for('forecasting_page') }}" class="nav-item {% if active=='forecasting' %}active{% endif %}">
        <span class="nav-icon">&#8599;</span> <span class="nav-label">Forecasting</span>
      </a>
      <a href="{{ url_for('alerts_page') }}" class="nav-item {% if active=='alerts' %}active{% endif %}">
        <span class="nav-icon">&#9888;</span> <span class="nav-label">Alerts</span>
      </a>
      <a href="{{ url_for('insights_page') }}" class="nav-item {% if active=='insights' %}active{% endif %}">
        <span class="nav-icon">&#9737;</span> <span class="nav-label">Insights</span>
      </a>
      <a href="{{ url_for('reports_page') }}" class="nav-item {% if active=='reports' %}active{% endif %}">
        <span class="nav-icon">&#8615;</span> <span class="nav-label">Reports</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="reload-data-btn" class="ghost-btn" title="Re-run the cleaning pipeline on the source CSVs">
        Reload &amp; re-clean data
      </button>
      <span class="sidebar-note">Python / Flask / scikit-learn</span>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="topbar-right">
        <span id="data-status" class="status-pill status-pill--muted">Loading data&hellip;</span>
      </div>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
